<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P&amp;R Counter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one narrow phone-first column; home is a call-sheet list, each DF page reads top-down: how it works → what opens → counters */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#151A21; --muted:#5A6371; --line:#DCE0E6;
  --punish:#C8501C; --punish-soft:#FBEDE5; --prevent:#2560A6; --prevent-soft:#E7EFF9;
  --warn:#8A5A00; --warn-soft:#FFF3D6;
  --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1318; --surface:#171C24; --ink:#E8ECF1; --muted:#9BA5B3; --line:#2A313C;
  --punish:#F08447; --punish-soft:#2E1E16; --prevent:#74AAEA; --prevent-soft:#172334;
  --warn:#F2C36B; --warn-soft:#2C2412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1318; --surface:#171C24; --ink:#E8ECF1; --muted:#9BA5B3; --line:#2A313C;
  --punish:#F08447; --punish-soft:#2E1E16; --prevent:#74AAEA; --prevent-soft:#172334;
  --warn:#F2C36B; --warn-soft:#2C2412; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--prevent);outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.02em;text-decoration:none}
.top nav{display:flex;gap:16px;font-size:13px;font-weight:700}
.top nav a{text-decoration:none;color:var(--muted)}
.top nav a[aria-current="page"]{color:var(--ink)}

/* home */
.intro{padding-block:22px 6px}
.intro h1{font-size:24px;line-height:1.4}
.intro p{margin:8px 0 0;color:var(--muted);max-width:34em}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.group{margin-top:28px}
.group h2{font-size:13px;letter-spacing:.08em;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line)}
.dflist{list-style:none;margin:0;padding:0}
.dflist a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);text-decoration:none}
.dflist a:hover .call{color:var(--punish)}
.call{font-family:var(--display);font-size:24px;line-height:1.2;letter-spacing:.01em}
.dflist .jp{font-size:13px;color:var(--muted);font-weight:700;margin-left:8px;font-family:var(--body)}
.dflist .sum{grid-column:1;font-size:13px;color:var(--muted);line-height:1.6}
.dflist .count{grid-row:1/3;grid-column:2;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}

/* tags */
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:3px;line-height:1.7;white-space:nowrap}
.tag.punish{background:var(--punish-soft);color:var(--punish)}
.tag.prevent{background:var(--prevent-soft);color:var(--prevent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.src{border:1px solid var(--line);color:var(--muted)}

/* DF page */
.back{display:inline-block;margin-top:18px;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none}
.dfhead{padding-block:10px 4px}
.dfhead .call{font-size:40px;display:block}
.dfhead .names{font-size:14px;color:var(--muted);font-weight:700}
.facts{display:grid;gap:14px;margin-top:18px}
.fact h3{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.fact p{margin:2px 0 0}
.fact.open h3{color:var(--punish)}
.fact.open p{font-weight:700}

section.block{margin-top:30px}
section.block>h2{font-size:18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
section.block>h2 small{font-size:12px;color:var(--muted);font-weight:400}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}

.counters{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
details.counter{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.counter>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px}
details.counter>summary::-webkit-details-marker{display:none}
.num{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.3;text-align:center;min-width:2.6em}
.num b{display:block;font-size:20px;color:var(--ink);font-weight:500}
.cname{font-weight:700;font-size:16px;line-height:1.45}
.cname .tag{margin-left:6px;vertical-align:2px}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .15s}
details[open] .chev{transform:rotate(-135deg);margin:4px 4px 0 0}
.cbody{padding:0 14px 14px;display:grid;gap:10px}
.cbody p{margin:0}

/* videos */
.vids{display:grid;gap:8px}
.vid{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.vbtn{display:flex;width:100%;align-items:center;gap:12px;padding:10px 12px;background:none;border:0;text-align:left;cursor:pointer;text-decoration:none}
.play{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);position:relative}
.play::after{content:"";position:absolute;left:12px;top:9px;border-left:10px solid var(--bg);border-top:6px solid transparent;border-bottom:6px solid transparent}
.vbtn.link .play{background:var(--muted)}
.vmeta{min-width:0;display:grid;gap:2px}
.vtitle{font-weight:700;font-size:14px;line-height:1.5}
.vsub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.time{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.frame{position:relative;aspect-ratio:16/9;max-width:100%;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:16px 0 0}
.roles div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface);min-width:0}
.roles dt{font-weight:700;font-size:14px}
.roles dd{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
.read{display:grid;gap:6px}
.read p{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.rl{font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:3px;background:var(--prevent-soft);color:var(--prevent);white-space:nowrap}
.rl.go{background:var(--punish-soft);color:var(--punish)}
.vfile{margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.vfile video{display:block;width:100%;max-width:100%;aspect-ratio:16/9;background:#000}
.vfile figcaption{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 12px;font-size:12px;color:var(--muted)}
.vfoot{display:flex;justify-content:flex-end;padding:6px 10px;font-size:12px}
.vfoot a{color:var(--muted)}
.pending{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;font-size:13px;color:var(--muted)}
.pending i{white-space:nowrap;font-style:normal;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px}

/* principles */
.plist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:0}
.plist li{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.plist .pn{font-family:var(--display);font-size:22px;line-height:1.2;color:var(--punish)}
.plist h3{font-size:16px}
.plist p{margin:0;grid-column:2;color:var(--ink)}
.pp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:12px}
.pp div{padding:14px;border-radius:8px;min-width:0}
.pp .a{background:var(--prevent-soft)}
.pp .b{background:var(--punish-soft)}
.pp h3{font-size:15px;margin-bottom:4px}
.pp p{margin:0;font-size:14px}
.stat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.stat b{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;min-width:4.2em}
.stat p{margin:0}
.cite{font-size:12px;color:var(--muted);margin-top:8px}
.note{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.chev{transition:none}}
@media (max-width:420px){.dfhead .call{font-size:34px}.call{font-size:21px}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#">P&amp;R COUNTER</a>
    <nav aria-label="メニュー">
      <a href="#" data-nav="home">守り方</a>
      <a href="#principles" data-nav="principles">原則</a>
    </nav>
  </header>
  <main id="app"></main>
  <p class="note">チーム内の振り返り用ページです。URLはチーム外に共有しないでください。<span id="mode-note"></span></p>
</div>

<script>

   準備中 {pending:'名前'}  */
const OKC = 'pQbaEZKZPHs';
const DF = [

  see:[{y:OKC,t:45,label:'P&Rディフェンス6種類 / OKCサンダー（ドロップ）',chk:true},{pending:'バスタミ解説（メリット・デメリット）'}],

  prevent:[

 {id:'hard-show', group:'pnr', call:'HARD SHOW', jp:'ハードショウ', en:'Hard Show / Hedge',
  how:'スクリーナーDFが高く飛び出してボールマンの進行を即座に止め、元のマークへ戻る。',
  open:'スクリーナーがダイブした際、ゴール下やインサイドに大きな空きができる。',
  see:[{y:OKC,t:90,label:'P&Rディフェンス6種類 / OKCサンダー（ハードショウ）',chk:true},{pending:'Basics of PnR（Hedge突破ドリル）'}],
  punish:[

     {y:'tZfqUFDymJ0',t:0,label:'Short Roll vs Hard-Show or Blitz',by:'MBTR',chk:true},

   ['スリップ','スクリーンが接触する前に、ゴール下へダイブする。',[

  prevent:[
   ['Ramスクリーン','事前にスクリーナーのDFへスクリーンをかけて、ショウを出させない。',[{u:'https://note.com/btt_91/n/n56e5af680c3',label:'ラムスクリーン：ピックアンドロールの鍵',kind:'記事',chk:true}]],

 {id:'blitz', group:'pnr', call:'BLITZ', jp:'ブリッツ', en:'Blitz / Trap',

  open:'パスを出された瞬間、後ろで攻撃4人対守備3人の数的優位ができる。',
  see:[{y:OKC,t:130,label:'P&Rディフェンス6種類 / OKCサンダー（トラップ）',chk:true}],

   ['Ramスクリーン','ダブルチームの形を作らせない。',[{u:'https://note.com/btt_91/n/n56e5af680c3',label:'ラムスクリーン：ピックアンドロールの鍵',kind:'記事',chk:true}]]]},

 {id:'ice', group:'pnr', call:'ICE', jp:'アイス', en:'Ice / Blue / Down',

  open:'サイドライン沿いのドライブや、角度を変えたパス・リジェクトに対応しにくい。',
  see:[{y:OKC,t:180,label:'P&Rディフェンス6種類 / OKCサンダー（アイス）',chk:true},

  punish:[

  how:'ボールマンDFがスクリーナーの後ろ（内側）をくぐり抜けてマークを維持する。',

  see:[{pending:'大和籠球（Underに対するTwist）'}],
  punish:[

  prevent:[
   ['ツイスト','スクリーナーがすぐに逆向きへスクリーンをかけ直し、DFに上を通らせる。',[
     {y:'8600lsfq8bA',t:40,label:'ホーンセット「ストロング」ツイストのピック＆ロール',chk:true}]]]},

 {id:'jam', group:'pnr', call:'JAM', jp:'ジャム', en:'Jam',

  see:[{y:'S2_tp4zhTKM',t:135,label:'ピック＆ロール ディフェンス ダイジェスト版（Jam）',chk:true},{pending:'Five Spirits（Jam & Contain）'}],
  punish:[

 {id:'push', group:'pnr', call:'PUSH', jp:'プッシュ', en:'Push / Slide',

 {id:'wall', group:'help', call:'WALL', jp:'ウォール', en:'Wall',
  how:'1 Pass AwayのDFがコースに入り、スイッチしながら壁を作る。',
  open:'パスアウト先やウィークサイドへの展開に対して、マークのズレが生じる。',
  see:[{u:'https://jlc-ondemand.com/video/1074',label:'恩塚亨 Pick and Roll defense Series1（ウォール）',kind:'コーチ向け',chk:true},{pending:'大和籠球（Wallディフェンス解説）'}],
  punish:[
   ['クイックキックアウト','壁ができた瞬間に、外へパスを出す。',[]],
   ['ウィークサイドへの展開','広くパスを回して、ズレを突く。',[]]],
  prevent:[
   ['1 Pass AwayのDFを剥がす','事前のスクリーンやカットで、壁を作るDFを引き離す。',[]]]}
];

const PRINCIPLES = {
  pp:[
    ['Prevent（事前に防ぐ）','相手の守り（ハードショウ、アイス、ブリッツなど）が完成する前に、Ramスクリーンやゴーストスクリーン、早いロールで守りの形を作らせない。'],
    ['Punish（代償を払わせる）','相手の守り（ドロップ、スイッチ、ネクストなど）が完成した後に、その守りが空けている場所（ミドルシュート、ショートロールの4対3、ミスマッチなど）を正確に突く。']],
  rules:[
    ['5人で攻める','P&Rはボールマンとスクリーナーの2人だけのプレーではない。残り3人のスペーシング（コーナーを埋める、カッティング）があって初めて完結する。'],
    ['2ドリブルで決める','スクリーンを使った後は、原則2ドリブル以内でシュート・パス・ドライブを決める。3ドリブル以上つくと、DFのローテーションが戻ってしまう。'],
    ['まずリジェクトを狙う','常にスクリーンを使わない側へのドライブを最初に狙う。DFがリジェクトを警戒するから、スクリーンがかかりやすくなる。'],
    ['ショートロールで全体を見る','激しい守りには深くダイブせず、フリースローライン付近で受けて、バックターンかフロントターンでコート全体を見て4対3を作る。'],
    ['1 Pass AwayのDFを剥がす','ヘルプやウォールを狙う隣のDFに対して、事前のスクリーンやVカットでスペースを作る。']],
  basics:[{f:'videos/screen-basics.mp4',poster:'videos/screen-basics.jpg',label:'良いスクリーン、悪いスクリーン',dur:'1:25'}]
};

/* セットプレー：相手の反応（see）→ 攻め方（go） */
const ACTIONS = [
 {id:'spain', call:'SPAIN P&R', jp:'スペイン・ピック＆ロール', en:'Spain Pick & Roll',
  how:'通常のP&Rに3人目の「スタックスクリーナー」を加えたセット。スクリーナーがロールする瞬間、スタックスクリーナーがロールマンのDFにバックスクリーンをかけ、そのままポップする。',
  roles:[['ハンドラー','ボールを持ってP&Rを使う'],['ロールマン','ボールスクリーンをかけてゴールへロールする'],['スタックスクリーナー','ロールマンのDFにバックスクリーンをかけ、外へポップする']],
  overview:{f:'videos/spain-overview.mp4',poster:'videos/spain-overview.jpg',label:'Spain P&R 解説',dur:'0:26'},
  reads:[
   ['Handler Attack','スタックスクリーナーのDFがロールマンを守りに行った','ハンドラーが空く。ドライブかプルアップで自分で攻める。',{f:'videos/spain-handler.mp4',poster:'videos/spain-handler.jpg',label:'Spain P&R Handler Attack',dur:'0:37'}],
   ['Roller Open','スタックスクリーナーのDFがハンドラーを守りに行った','ロールマンが空く。ゴールへ向かうロールマンにパスする。',{f:'videos/spain-roller.mp4',poster:'videos/spain-roller.jpg',label:'Spain P&R Roller Open',dur:'0:37'}],
   ['Stack Pop Open','スタックスクリーナーのDFがハンドラーを守りに行き、ロールマンも止められた','スタックスクリーナーが空く。ポップした3Pシューターにパスする。',{f:'videos/spain-stackpop.mp4',poster:'videos/spain-stackpop.jpg',label:'Spain P&R Stack Pop Open',dur:'0:27'}],
   ['Skip Pass','コーナーのDFがロールマンにタグ（ヘルプ）に来た','コーナーが空く。逆サイドのコーナーへスキップパスを飛ばす。',{f:'videos/spain-skip.mp4',poster:'videos/spain-skip.jpg',label:'Spain P&R Skip Pass',dur:'0:32'}]]}
];

/* ===== 表示 ===== */
// 動画をページ内に埋め込めるのはGitHub Pagesなど通常のサイトだけ。プレビュー環境ではYouTubeを別タブで開く。
const EMBED = location.protocol === 'file:' || /github\.io$|localhost$/.test(location.hostname) || document.documentElement.dataset.embed === 'on';
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => Math.floor(t/60) + ':' + String(t%60).padStart(2,'0');
const ytUrl = v => `https://www.youtube.com/watch?v=${v.y}${v.t ? '&t=' + v.t + 's' : ''}`;
const GROUPS = [['pnr','P&Rの守り方','スクリーナーとボールマンのDFがどう守るか'],['help','ヘルプの守り方','周りのDFがどう助けに来るか']];

function videoHTML(v){
  if (v.pending) return `<div class="pending"><i>準備中</i>${esc(v.pending)}</div>`;
  if (v.f) return `<figure class="vfile"><video controls playsinline preload="metadata" ${v.poster ? `poster="${esc(v.poster)}"` : ''} src="${esc(v.f)}"></video><figcaption><span class="vtitle">${esc(v.label)}</span>${v.dur ? `<span class="time">${esc(v.dur)}</span>` : ''}</figcaption></figure>`;
  const badges = (v.by ? `<span class="tag src">${esc(v.by)}</span>` : '') + (v.kind ? `<span class="tag src">${esc(v.kind)}</span>` : '') + (v.chk ? '<span class="tag warn">要確認</span>' : '');
  if (v.u) return `<div class="vid"><a class="vbtn link" href="${esc(v.u)}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><span class="vmeta"><span class="vtitle">${esc(v.label)}</span><span class="vsub">${badges}<span>別タブで開く</span></span></span></a></div>`;
  const time = `<span class="time">${v.t ? fmt(v.t) + '〜' : '最初から'}</span>`;
  const inner = `<span class="play" aria-hidden="true"></span><span class="vmeta"><span class="vtitle">${esc(v.label)}</span><span class="vsub">${time}${badges}</span></span>`;
  if (EMBED) return `<div class="vid"><button class="vbtn" type="button" data-y="${esc(v.y)}" data-t="${v.t||0}">${inner}</button></div>`;
  return `<div class="vid"><a class="vbtn" href="${ytUrl(v)}" target="_blank" rel="noopener">${inner}</a></div>`;
}
const vidsHTML = list => list.length ? `<div class="vids">${list.map(videoHTML).join('')}</div>` : `<div class="pending"><i>準備中</i>動画を準備しています</div>`;

function home(){
  const g = GROUPS.map(([key, title, sub]) => `
    <section class="group"><h2>${title}<span style="font-weight:400"> ・ ${sub}</span></h2>
    <ul class="dflist">${DF.filter(d => d.group === key).map(d => `
      <li><a href="#${d.id}"><span class="call">${esc(d.call)}<span class="jp">${esc(d.jp)}</span></span>
      <span class="count">${d.punish.length + d.prevent.length} カウンター</span>
      <span class="sum">${esc(d.how)}</span></a></li>`).join('')}</ul></section>`).join('')
    + `<section class="group"><h2>セットプレー<span style="font-weight:400"> ・ 相手の反応を読んで攻める形</span></h2>
    <ul class="dflist">${ACTIONS.map(a => `
      <li><a href="#${a.id}"><span class="call">${esc(a.call)}<span class="jp">${esc(a.jp)}</span></span>
      <span class="count">${a.reads.length} つの読み</span>
      <span class="sum">${esc(a.how.split('。')[0])}。</span></a></li>`).join('')}</ul></section>`;
  $app.innerHTML = `<div class="intro"><h1>相手DF別カウンター</h1>
    <p>相手のP&Rディフェンスを見分けて、どのカウンターで攻めるかを確認するページです。守り方を選ぶと、カウンターと動画が出てきます。</p>
    <div class="legend"><span><span class="tag punish">PUNISH</span>完成した守りを崩す</span><span><span class="tag prevent">PREVENT</span>守りの形を作らせない</span></div></div>${g}`;
}

function counterList(items, kind, start){
  return items.map(([name, desc, vids], i) => `
    <li><details class="counter"><summary><span class="num">カウンター<b>${start + i}</b></span>
      <span class="cname">${esc(name)}<span class="tag ${kind}">${kind.toUpperCase()}</span></span><span class="chev" aria-hidden="true"></span></summary>
      <div class="cbody"><p>${esc(desc)}</p>${vidsHTML(vids)}</div></details></li>`).join('');
}

function dfPage(d){
  $app.innerHTML = `<a class="back" href="#">← 守り方の一覧</a>
    <div class="dfhead"><span class="eyebrow">${d.group === 'pnr' ? 'P&Rの守り方' : 'ヘルプの守り方'}</span>
      <h1 class="call">${esc(d.call)}</h1><span class="names">${esc(d.jp)}（${esc(d.en)}）</span></div>
    <div class="facts"><div class="fact"><h3>どう守ってくるか</h3><p>${esc(d.how)}</p></div>
      <div class="fact open"><h3>空くところ</h3><p>${esc(d.open)}</p></div></div>
    <section class="block"><h2>① DFを見分ける</h2><p class="sub">この守り方がどんな形か、まず動画で確認します。</p><div style="margin-top:10px">${vidsHTML(d.see)}</div></section>
    <section class="block"><h2>② ${esc(d.call)}へのカウンター</h2>
      <h3 style="margin-top:16px"><span class="tag punish">PUNISH</span> <small style="color:var(--muted);font-weight:400">完成した守りを崩す</small></h3>
      <ul class="counters">${counterList(d.punish, 'punish', 1)}</ul>
      <h3 style="margin-top:20px"><span class="tag prevent">PREVENT</span> <small style="color:var(--muted);font-weight:400">守りの形を作らせない</small></h3>
      <ul class="counters">${counterList(d.prevent, 'prevent', d.punish.length + 1)}</ul></section>`;
}

function actionPage(a){
  $app.innerHTML = `<a class="back" href="#">← 一覧に戻る</a>
    <div class="dfhead"><span class="eyebrow">セットプレー</span>
      <h1 class="call">${esc(a.call)}</h1><span class="names">${esc(a.jp)}（${esc(a.en)}）</span></div>
    <div class="facts"><div class="fact"><h3>どんな形か</h3><p>${esc(a.how)}</p></div></div>
    <dl class="roles">${a.roles.map(([r, d]) => `<div><dt>${esc(r)}</dt><dd>${esc(d)}</dd></div>`).join('')}</dl>
    <section class="block"><h2>① 形を確認する</h2><div style="margin-top:10px">${vidsHTML([a.overview])}</div></section>
    <section class="block"><h2>② 読み：どこが空くか</h2><p class="sub">スタックスクリーナーのDFとコーナーのDFの動きを見て、空いた選手を使います。</p>
      <ul class="counters">${a.reads.map(([name, see, go, v], i) => `
        <li><details class="counter"><summary><span class="num">読み<b>${i + 1}</b></span>
          <span class="cname">${esc(name)}</span><span class="chev" aria-hidden="true"></span></summary>
          <div class="cbody"><div class="read"><p><span class="rl">相手</span>${esc(see)}</p><p><span class="rl go">攻め</span>${esc(go)}</p></div>${vidsHTML([v])}</div></details></li>`).join('')}</ul></section>`;
}

function principles(){
  const P = PRINCIPLES;
  $app.innerHTML = `<div class="intro"><h1>P&Rの原則</h1><p>どの守り方が相手でも共通する考え方です。</p></div>
    <section class="block"><h2>PreventとPunish</h2><div class="pp">
      <div class="a"><h3>${P.pp[0][0]}</h3><p>${P.pp[0][1]}</p></div><div class="b"><h3>${P.pp[1][0]}</h3><p>${P.pp[1][1]}</p></div></div></section>
    <section class="block"><h2>5つの原則</h2><ol class="plist">${P.rules.map(([h, p], i) => `<li><span class="pn">${i + 1}</span><h3>${h}</h3><p>${p}</p></li>`).join('')}</ol></section>
    <section class="block"><h2>データで見るP&R</h2>
      <div class="stat"><b>71.8%</b><p>P&Rを始めたポゼッションのうち、シュートまたはフリースローで終わった割合。</p></div>
      <div class="stat"><b>1パス</b><p>P&Rから1パス以内でシュートに至った攻撃が、最も得点につながりやすかった。</p></div>
      <p class="cite">出典：Amatria et al.（2025）女子ユーロリーグ Final Four 2021–22 の分析</p></section>
    <section class="block"><h2>スクリーンの基本</h2><div style="margin-top:10px">${vidsHTML(P.basics)}</div></section>`;
}

function route(){
  const id = location.hash.replace('#', '');
  const d = DF.find(x => x.id === id);
  const act = ACTIONS.find(x => x.id === id);
  if (d) dfPage(d); else if (act) actionPage(act); else if (id === 'principles') principles(); else home();
  document.querySelectorAll('[data-nav]').forEach(a => {
    if ((id === 'principles') === (a.dataset.nav === 'principles')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  document.title = d ? `${d.call} | P&R Counter` : act ? `${act.call} | P&R Counter` : 'P&R Counter';
  window.scrollTo(0, 0);
}

$app.addEventListener('click', e => {
  const b = e.target.closest('button.vbtn');
  if (!b) return;
  const v = {y: b.dataset.y, t: +b.dataset.t};
  const box = b.parentElement;
  box.innerHTML = `<div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.y)}?start=${v.t}&autoplay=1&rel=0&playsinline=1" title="動画" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <div class="vfoot"><a href="${ytUrl(v)}" target="_blank" rel="noopener">再生できない場合はYouTubeで開く</a></div>`;
});
if (!EMBED) document.getElementById('mode-note').textContent = 'このプレビューでは動画はYouTubeで開きます。公開版ではページ内で再生できます。';
window.addEventListener('hashchange', route);
route();
</script>

</body>
</html>
